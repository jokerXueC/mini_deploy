# mini_deploy-managed: nginx-v1
log_format mini_deploy_no_query '$remote_addr [$time_local] '
                                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                '"$http_user_agent"';

server {
    listen 80;
    server_name ops.example.com;

    client_max_body_size 20m;

    access_log /var/log/nginx/mini-deploy.access.log mini_deploy_no_query;

    location = /deploy/ui {
        return 302 /deploy/ui/;
    }

    location /deploy/ui/ {
        proxy_pass http://127.0.0.1:6868/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /deploy/ {
        proxy_pass http://127.0.0.1:6868/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
