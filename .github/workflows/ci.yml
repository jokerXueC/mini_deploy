name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint Python
        run: ruff check agent.py certificates.py certificate_discovery.py nginx_runtime.py nginx_install.py nginx_requests.py caddy_requests.py request_gateway.py request_history.py gateway_connections.py monitoring.py docker_mirrors.py scripts/verify_backup.py tests
      - name: Run tests
        run: pytest

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find ui -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test dashboard navigation
        run: node --test tests/ui_*.test.cjs

  request-gateway:
    name: Request gateway Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m venv .gateway-test-venv
          .gateway-test-venv/bin/pip install -r requirements-dev.txt
      - name: Test actual hardened gateway, streaming and Docker DNS
        run: sudo env MINI_DEPLOY_GATEWAY_DOCKER_TESTS=1 .gateway-test-venv/bin/python -m pytest tests/test_request_gateway_integration.py tests/test_gateway_connections_integration.py -q

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for script in install.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check shell scripts
        run: shellcheck --severity=warning install.sh scripts/*.sh
