name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint Python
        run: ruff check agent.py certificates.py nginx_runtime.py nginx_install.py project_guidance.py entrypoint_checks.py scripts/verify_backup.py tests
      - name: Run tests
        run: pytest

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find ui -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test dashboard navigation
        run: node --test tests/ui_navigation.test.cjs tests/ui_motion.test.cjs tests/ui_onboarding.test.cjs tests/ui_nginx.test.cjs

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh
      - name: Check shell scripts
        run: shellcheck --severity=warning install.sh scripts/*.sh
