<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini_deploy Login</title>
  <script>
    (() => {
      let stored = '';
      try { stored = localStorage.getItem('mini_deploy-theme') || ''; } catch (_) {}
      const hour = new Date().getHours();
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
        ? stored : hour >= 7 && hour < 19 ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="mark">MD</div>
      <h1>部署监控</h1>
      <p>输入部署面板密码查看 CI/CD 状态。</p>
      {{ERROR_HTML}}
      {{SETUP_NOTE}}
      {{FORM_HTML}}
    </section>
  </main>
</body>
</html>
